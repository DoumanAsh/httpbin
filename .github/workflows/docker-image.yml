name: Docker

on:
  # Once a month
  schedule:
    - cron: "0 0 1 * *"
  release:
    types:
      - created
  push:
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'

env:
  DOCKER_REGISTRY: docker.io
  GITHUB_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: douman/httpbin
  GITHUB_IMAGE_NAME: doumanash/httpbin

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: |
          VERSION=$(head -n 5 Cargo.toml | grep version | cut -d '=' -f 2 | tr -d ' ' | tr -d '"')
          echo "value=$VERSION" >> $GITHUB_OUTPUT >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
          platforms: arm64

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log into ${{ env.DOCKER_REGISTRY }} registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: douman
          ## Set in repo Settings->Secrets->New repository secret
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log into ${{ env.GITHUB_REGISTRY }} registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build-docker
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{env.DOCKER_REGISTRY}}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{env.GITHUB_REGISTRY}}/${{ env.GITHUB_IMAGE_NAME }}:latest

      - name: Push Docker image
        id: push-docker
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.GITHUB_IMAGE_NAME }}:latest
            ${{ env.GITHUB_REGISTRY }}/${{ env.GITHUB_IMAGE_NAME }}:${{ steps.version.outputs.value }}
