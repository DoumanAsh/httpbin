name: Docker

on:
  # Once a month
  schedule:
    - cron: "0 0 1 * *"
  release:
    types:
      - created
  push:
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'

jobs:
  container:
    name: "${{ github.event.repository.name }}"
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write
      pull-requests: write
    uses: DoumanAsh/douman-ci/.github/workflows/release-container.yaml@master
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    with:
      # Make sure to create repos in all container registries using the same name as the repo
      image_name: ${{ github.event.repository.name }}
      annotations: |
        org.opencontainers.image.title=${{ github.event.repository.name }}
        org.opencontainers.image.description=${{ github.event.repository.description }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
      container_file: "Dockerfile"
      use_oci: true
      platform: "linux"
      archs: "amd64 arm64"
      upload_container: ${{ github.event.pull_request.draft == false }}
      docker_user: "douman"
      github_user: "doumanash"
      quay_user: "doumanash"
      quay_bot_suffix: "httpbin-ci"
      post_build_script: |
          VERSION=$(head -n 3 Cargo.toml | grep version | cut -d '=' -f 2 | tr -d ' ' | tr -d '"')
          echo "- Version: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "tags=latest $VERSION" >> "$GITHUB_OUTPUT"
