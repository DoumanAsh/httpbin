name: Release

permissions:
  # Attaching binary to release requires write perms
  contents: write

on:
  release:
    types:
      - created

jobs:
  rust:
    name: "${{ github.event.repository.name }}"
    if: github.event.pull_request.draft == false
    uses: DoumanAsh/douman-ci/.github/workflows/release-rust.yaml@master
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      file_suffix: "httpbin-"
      github_repositroy: ${{ github.repository }}
      github_release_id: ${{ github.event.release.id }}
      github_upload_release: ${{ github.event_name != 'pull_request' }}
      cargo-binaries: "httpbin"
